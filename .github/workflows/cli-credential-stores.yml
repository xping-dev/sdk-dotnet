name: CLI Credential Stores

# The xping CLI's OS keychain backends against the real Windows Credential Manager, macOS Keychain
# and Secret Service (cli-auth-cli-spec §17.2). Weekly, not per PR, to protect the free CI minutes
# (A-7, Q-7); run it by hand after changing a backend.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-stores:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tests/Xping.Cli.Tests --configuration Release

      - name: Install the Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus

      # A private session bus with an unlocked login keyring; the password only exists for this run.
      - name: Run credential store tests (Secret Service)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c '
            echo -n "xping-cli-tests" | gnome-keyring-daemon --unlock --components=secrets > /dev/null &&
            dotnet test tests/Xping.Cli.Tests --no-build --configuration Release --filter "Category=CredentialStore" --logger "console;verbosity=normal"
          '

      # Without a session bus the CLI must fall back to the file.
      - name: Run fallback tests (no session bus)
        if: runner.os == 'Linux'
        run: |
          env -u DBUS_SESSION_BUS_ADDRESS \
            dotnet test tests/Xping.Cli.Tests --no-build --configuration Release --filter "FullyQualifiedName~LibSecretStoreTests&Category!=CredentialStore" --logger "console;verbosity=normal"

      - name: Run credential store tests
        if: runner.os != 'Linux'
        run: dotnet test tests/Xping.Cli.Tests --no-build --configuration Release --filter "Category=CredentialStore" --logger "console;verbosity=normal"
