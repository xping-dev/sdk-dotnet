name: Docs

# Builds the docs site on every pull request that can change it, and fails on any docfx build
# warning (a broken link, a missing bookmark, an unknown uid). It only builds: the site is deployed
# from release tags by release.yml.
on:
  pull_request:
    # feat/** so that a phase PR into a long-lived feature branch is checked before it merges.
    branches: [main, 'feat/**']
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install docfx
        run: dotnet tool update -g docfx

      # Without --warningsAsErrors: metadata prints two accepted warnings, "Found project reference
      # without a matching metadata reference", once for Xping.Sdk.Shared and once for Xping.Sdk.Core
      # (specs/docs-overhaul.md, Q1).
      - name: Generate the API reference
        run: docfx metadata docs/docfx.json

      - name: Build the site
        run: docfx build docs/docfx.json --warningsAsErrors
