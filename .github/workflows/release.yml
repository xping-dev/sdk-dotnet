name: Release
on:
  release:
    types: [published]
  # Redeploys the docs only. Packages ship from a published release, so the version always comes
  # from a tag (scripts/release.py creates it).
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # nuget.org versions cannot be deleted, so refuse a tag that is not SemVer or not on main.
    - name: Check the release tag
      id: get_version
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z[-suffix] tag"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build -c Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}
    
    - name: Pack all SDK packages
      run: dotnet pack -c Release --no-build -p:Version=${{ steps.get_version.outputs.VERSION }} -o _build/nuget
    
    - name: Verify the CLI tool installs and runs
      run: |
        set -euo pipefail
        dotnet tool install -g Xping.Cli \
          --add-source _build/nuget \
          --version ${{ steps.get_version.outputs.VERSION }}
        export PATH="$PATH:$HOME/.dotnet/tools"
        xping --version
        xping --help
        # The usage line comes from the entry assembly, so it silently reverts to "Xping.Cli"
        # if AssemblyName is ever dropped from the csproj. Only an installed tool can catch it -
        # in-process tests see the test host's name instead.
        xping --help | grep -q 'xping \[command\]'

    - uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: _build/nuget

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    # Required reviewers on this environment gate the push to nuget.org.
    environment: nuget
    permissions:
      contents: write
      id-token: write  # lets NuGet/login exchange a GitHub OIDC token for a short-lived nuget.org key
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: _build/nuget
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      
      # Trusted publishing: the key lives for 1 hour, so request it right before the push.
      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        run: |
          dotnet nuget push "_build/nuget/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --skip-duplicate --source https://api.nuget.org/v3/index.json
      
      - name: Upload packages to GitHub release
        run: |
          gh release upload --repo xping-dev/sdk-dotnet ${GITHUB_REF_NAME} _build/nuget/Xping.Sdk.Core.${{ steps.get_version.outputs.VERSION }}.nupkg
          gh release upload --repo xping-dev/sdk-dotnet ${GITHUB_REF_NAME} _build/nuget/Xping.Sdk.NUnit.${{ steps.get_version.outputs.VERSION }}.nupkg
          gh release upload --repo xping-dev/sdk-dotnet ${GITHUB_REF_NAME} _build/nuget/Xping.Sdk.XUnit.${{ steps.get_version.outputs.VERSION }}.nupkg
          gh release upload --repo xping-dev/sdk-dotnet ${GITHUB_REF_NAME} _build/nuget/Xping.Sdk.XUnit.V3.${{ steps.get_version.outputs.VERSION }}.nupkg
          gh release upload --repo xping-dev/sdk-dotnet ${GITHUB_REF_NAME} _build/nuget/Xping.Sdk.MSTest.${{ steps.get_version.outputs.VERSION }}.nupkg
          gh release upload --repo xping-dev/sdk-dotnet ${GITHUB_REF_NAME} _build/nuget/Xping.Cli.${{ steps.get_version.outputs.VERSION }}.nupkg
        env:
          GH_TOKEN: ${{ github.token }}

  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      actions: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - run: dotnet tool update -g docfx
    - run: docfx ./docs/docfx.json  
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: './docs/_site'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
