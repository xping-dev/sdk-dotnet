<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Xping architecture</title>
  <desc id="desc">The Xping SDK captures telemetry during a test run and writes it to a local .xping folder, then uploads it to Xping Cloud. The Xping CLI reads the local history and also receives scores and verdicts from Xping Cloud. The Xping Portal reads Xping Cloud only.</desc>

  <style>
    .lane   { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 4; }
    .lbl    { font-size: 11.5px; fill: #59636e; }
    .th     { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .ts     { font-size: 11.5px; fill: #59636e; }
    .arr    { fill: none; stroke: #6e7781; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .b-loc  { fill: #e6f4f2; stroke: #0f9b8e; stroke-width: 1; }
    .b-cld  { fill: #efeafc; stroke: #7c5cd6; stroke-width: 1; }
    text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .lane  { stroke: #3d444d; }
      .lbl   { fill: #9198a1; }
      .th    { fill: #e6edf3; }
      .ts    { fill: #9198a1; }
      .arr   { stroke: #8b949e; }
      .b-loc { fill: #0e332f; stroke: #2dd4bf; }
      .b-cld { fill: #241f45; stroke: #a78bfa; }
    }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Local lane -->
  <rect class="lane" x="40" y="46" width="600" height="124" rx="12"/>
  <text class="lbl" x="56" y="68">Your machine or CI runner</text>

  <g>
    <rect class="b-loc" x="55" y="90" width="180" height="56" rx="8"/>
    <text class="th" x="145" y="114" text-anchor="middle">Test run</text>
    <text class="ts" x="145" y="132" text-anchor="middle">SDK captures telemetry</text>
  </g>

  <g>
    <rect class="b-loc" x="265" y="90" width="150" height="56" rx="8"/>
    <text class="th" x="340" y="114" text-anchor="middle">.xping/</text>
    <text class="ts" x="340" y="132" text-anchor="middle">Local run history</text>
  </g>

  <g>
    <rect class="b-loc" x="445" y="90" width="170" height="56" rx="8"/>
    <text class="th" x="530" y="114" text-anchor="middle">Xping CLI</text>
    <text class="ts" x="530" y="132" text-anchor="middle">xping report</text>
  </g>

  <!-- Cloud lane -->
  <rect class="lane" x="40" y="230" width="600" height="124" rx="12"/>
  <text class="lbl" x="56" y="252">Xping Cloud, hosted</text>

  <g>
    <rect class="b-cld" x="100" y="274" width="220" height="56" rx="8"/>
    <text class="th" x="210" y="298" text-anchor="middle">Scoring engine</text>
    <text class="ts" x="210" y="316" text-anchor="middle">Confidence, flaky detection</text>
  </g>

  <g>
    <rect class="b-cld" x="380" y="274" width="180" height="56" rx="8"/>
    <text class="th" x="470" y="298" text-anchor="middle">Xping Portal</text>
    <text class="ts" x="470" y="316" text-anchor="middle">Dashboard, trends</text>
  </g>

  <!-- Flows -->
  <line class="arr" x1="237" y1="118" x2="261" y2="118" marker-end="url(#ah)"/>
  <line class="arr" x1="417" y1="118" x2="441" y2="118" marker-end="url(#ah)"/>
  <line class="arr" x1="322" y1="302" x2="376" y2="302" marker-end="url(#ah)"/>

  <path class="arr" d="M145 148 V200 H210 V270" marker-end="url(#ah)"/>
  <text class="ts" x="138" y="194" text-anchor="end">Upload</text>

  <path class="arr" d="M290 272 V205 H530 V150" marker-end="url(#ah)"/>
  <text class="ts" x="400" y="198" text-anchor="middle">Scores and verdicts</text>
</svg>
