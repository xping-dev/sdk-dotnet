<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>

  <!-- Test project -->
  <rect x="310" y="24" width="340" height="58" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="480" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Your test project</text>
  <text x="480" y="68" text-anchor="middle" font-size="12.5" fill="#656d76">xUnit · NUnit · MSTest</text>

  <line x1="480" y1="82" x2="480" y2="114" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Adapter -->
  <rect x="290" y="118" width="380" height="58" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="480" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Xping.Sdk.&lt;framework&gt; adapter</text>
  <text x="480" y="162" text-anchor="middle" font-size="12.5" fill="#656d76">test lifecycle hooks</text>

  <line x1="480" y1="176" x2="480" y2="208" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core -->
  <rect x="250" y="212" width="460" height="62" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="480" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Xping.Sdk.Core</text>
  <text x="480" y="258" text-anchor="middle" font-size="12.5" fill="#656d76">tracking · environment detection · batching</text>

  <!-- Split -->
  <line x1="480" y1="274" x2="480" y2="300" stroke="#57606a" stroke-width="1.5"/>
  <line x1="260" y1="300" x2="700" y2="300" stroke="#57606a" stroke-width="1.5"/>
  <line x1="260" y1="300" x2="260" y2="332" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="300" x2="700" y2="332" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="270" y="322" font-size="12" fill="#656d76">always</text>
  <text x="710" y="322" font-size="12" fill="#656d76">API key set</text>

  <!-- LOCAL panel -->
  <rect x="60" y="336" width="400" height="324" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1f2328">LOCAL — ALWAYS ON, NO ACCOUNT</text>

  <rect x="90" y="388" width="340" height="64" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="260" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">.xping/ local store</text>
  <text x="260" y="434" text-anchor="middle" font-size="12.5" fill="#656d76">run history on this machine</text>

  <line x1="260" y1="452" x2="260" y2="486" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="490" width="340" height="64" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="260" y="516" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">xping report</text>
  <text x="260" y="536" text-anchor="middle" font-size="12.5" fill="#656d76">observations · evidence · offline</text>

  <text x="260" y="586" text-anchor="middle" font-size="12" fill="#656d76">Evidence only — no confidence scores,</text>
  <text x="260" y="604" text-anchor="middle" font-size="12" fill="#656d76">no causal verdicts.</text>

  <!-- CLOUD panel -->
  <rect x="500" y="336" width="400" height="324" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="700" y="366" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1f2328">XPING CLOUD — OPTIONAL</text>

  <rect x="530" y="388" width="340" height="56" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="700" y="412" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Session assembly</text>
  <text x="700" y="431" text-anchor="middle" font-size="12.5" fill="#656d76">local runs + CI runs</text>

  <line x1="700" y1="444" x2="700" y2="472" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="474" width="340" height="64" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="700" y="500" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Confidence scoring</text>
  <text x="700" y="520" text-anchor="middle" font-size="12.5" fill="#656d76">ESS · evidence level · flaky detection</text>

  <line x1="700" y1="538" x2="700" y2="566" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="568" width="340" height="64" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="700" y="594" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Scores · trends</text>
  <text x="700" y="614" text-anchor="middle" font-size="12.5" fill="#656d76">PR comments</text>
</svg>
